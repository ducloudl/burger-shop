<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍔 3D汉堡店模拟器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #ff6b35;
      --secondary: #ffd700;
      --success: #4caf50;
      --danger: #e74c3c;
      --bg: #1a1a2e;
      --panel: #16213e;
      --text: #e8e8e8;
      --text-secondary: #999;
      --border: #333;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      touch-action: none;
    }
    
    #gameCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    
    .ui-overlay > * {
      pointer-events: auto;
    }
    
    /* Header */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 15px 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 {
      font-size: 24px;
      color: var(--secondary);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    
    .stats {
      display: flex;
      gap: 15px;
      font-size: 16px;
    }
    
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.1);
      padding: 8px 12px;
      border-radius: 20px;
    }
    
    .stat-item .icon {
      font-size: 20px;
    }
    
    /* Customer Order Panel */
    .order-panel {
      position: absolute;
      top: 80px;
      right: 20px;
      width: 280px;
      background: rgba(22, 33, 62, 0.95);
      border-radius: 15px;
      padding: 20px;
      border: 2px solid var(--primary);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    
    .order-panel h3 {
      font-size: 18px;
      margin-bottom: 15px;
      color: var(--secondary);
      text-align: center;
    }
    
    .order-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }
    
    .order-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      transition: all 0.3s;
    }
    
    .order-item.ready {
      background: rgba(76, 175, 80, 0.3);
      border: 1px solid var(--success);
    }
    
    .order-item.missing {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid var(--danger);
    }
    
    .order-item .ingredient-icon {
      font-size: 24px;
      width: 30px;
      text-align: center;
    }
    
    .order-item .ingredient-name {
      flex: 1;
      font-size: 14px;
    }
    
    .order-item .status-icon {
      font-size: 18px;
    }
    
    .timer-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    
    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--danger), var(--secondary), var(--success));
      transition: width 0.1s linear;
    }
    
    .customer-avatar {
      text-align: center;
      font-size: 48px;
      margin-bottom: 10px;
    }
    
    /* Ingredient Station */
    .station-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 33, 62, 0.95);
      border-radius: 15px;
      padding: 20px;
      border: 2px solid var(--primary);
      min-width: 400px;
      max-width: 90vw;
    }
    
    .station-title {
      text-align: center;
      font-size: 18px;
      color: var(--secondary);
      margin-bottom: 15px;
    }
    
    .ingredients-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    
    .ingredient-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 15px 10px;
      background: rgba(255,255,255,0.1);
      border: 2px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text);
    }
    
    .ingredient-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }
    
    .ingredient-btn:active {
      transform: translateY(0);
    }
    
    .ingredient-btn .icon {
      font-size: 32px;
    }
    
    .ingredient-btn .name {
      font-size: 12px;
      text-align: center;
    }
    
    /* Burger Assembly */
    .burger-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 300px;
      background: rgba(0,0,0,0.5);
      border-radius: 15px;
      padding: 20px;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 5px;
    }
    
    .burger-layer {
      width: 150px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      animation: dropIn 0.3s ease-out;
    }
    
    @keyframes dropIn {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .bottom-bun { background: #d4a574; }
    .top-bun { background: #d4a574; border-radius: 15px 15px 8px 8px; }
    .lettuce { background: #4caf50; }
    .tomato { background: #e74c3c; }
    .cheese { background: #ffd700; }
    .patty { background: #5d4037; }
    .onion { background: #fff; opacity: 0.7; }
    .pickle { background: #689f38; }
    
    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      justify-content: center;
    }
    
    .action-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .action-btn:hover {
      transform: translateY(-2px);
    }
    
    .action-btn:active {
      transform: translateY(0);
    }
    
    .btn-serve {
      background: var(--success);
      color: white;
    }
    
    .btn-clear {
      background: var(--danger);
      color: white;
    }
    
    .btn-next {
      background: var(--primary);
      color: white;
    }
    
    /* Start Screen */
    .start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      pointer-events: auto;
    }
    
    .start-screen h1 {
      font-size: 48px;
      color: var(--secondary);
      margin-bottom: 20px;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
    }
    
    .start-screen p {
      font-size: 18px;
      color: var(--text-secondary);
      margin-bottom: 40px;
      text-align: center;
      max-width: 500px;
      line-height: 1.6;
    }
    
    .start-btn {
      padding: 20px 60px;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 24px rgba(255, 107, 53, 0.4);
    }
    
    .start-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(255, 107, 53, 0.6);
    }
    
    /* Game Over Screen */
    .game-over-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      pointer-events: auto;
    }
    
    .game-over-screen.show {
      display: flex;
    }
    
    .game-over-screen h2 {
      font-size: 36px;
      color: var(--danger);
      margin-bottom: 20px;
    }
    
    .final-score {
      font-size: 24px;
      color: var(--secondary);
      margin-bottom: 40px;
    }
    
    /* Notification */
    .notification {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(22, 33, 62, 0.95);
      color: var(--text);
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      z-index: 50;
      transition: transform 0.3s ease-out;
      border: 2px solid var(--success);
    }
    
    .notification.show {
      transform: translateX(-50%) translateY(0);
    }
    
    .notification.error {
      border-color: var(--danger);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .order-panel {
        width: 200px;
        right: 10px;
        padding: 15px;
      }
      
      .station-panel {
        min-width: auto;
        width: calc(100% - 20px);
        left: 10px;
        transform: none;
      }
      
      .ingredients-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      
      .ingredient-btn {
        padding: 10px 5px;
      }
      
      .ingredient-btn .icon {
        font-size: 24px;
      }
      
      .ingredient-btn .name {
        font-size: 10px;
      }
      
      .burger-display {
        width: 150px;
        height: 200px;
      }
      
      .burger-layer {
        width: 120px;
        height: 25px;
      }
    }
  </style>
</head>
<body>
  <!-- 3D Canvas -->
  <canvas id="gameCanvas"></canvas>
  
  <!-- Start Screen -->
  <div class="start-screen" id="startScreen">
    <h1>🍔 汉堡店模拟器</h1>
    <p>你是汉堡店的新员工！根据客户订单制作汉堡，注意时间和准确性。点击开始，迎接第一位顾客吧！</p>
    <button class="start-btn" onclick="startGame()">开始营业</button>
  </div>
  
  <!-- Game Over Screen -->
  <div class="game-over-screen" id="gameOverScreen">
    <h2>🏪 打烊了！</h2>
    <div class="final-score" id="finalScore">最终得分: 0</div>
    <button class="start-btn" onclick="restartGame()">再来一天</button>
  </div>
  
  <!-- Notification -->
  <div class="notification" id="notification"></div>
  
  <!-- UI Overlay -->
  <div class="ui-overlay" id="gameUI" style="display: none;">
    <!-- Header -->
    <div class="header">
      <h1>🍔 汉堡店</h1>
      <div class="stats">
        <div class="stat-item">
          <span class="icon">💰</span>
          <span id="moneyDisplay">¥0</span>
        </div>
        <div class="stat-item">
          <span class="icon">⭐</span>
          <span id="scoreDisplay">0</span>
        </div>
        <div class="stat-item">
          <span class="icon">👥</span>
          <span id="servedDisplay">0/10</span>
        </div>
      </div>
    </div>
    
    <!-- Order Panel -->
    <div class="order-panel">
      <div class="customer-avatar" id="customerAvatar">😊</div>
      <h3>📋 客户订单</h3>
      <div class="timer-bar">
        <div class="timer-fill" id="timerFill" style="width: 100%"></div>
      </div>
      <div class="order-items" id="orderItems"></div>
      <div style="text-align: center; font-size: 12px; color: var(--text-secondary);">
        限时完成订单！
      </div>
    </div>
    
    <!-- Burger Display -->
    <div class="burger-display" id="burgerDisplay">
      <div style="text-align: center; color: var(--text-secondary); font-size: 14px;">
        汉堡组装区
      </div>
    </div>
    
    <!-- Station Panel -->
    <div class="station-panel">
      <div class="station-title">🍽️ 食材站 - 点击添加</div>
      <div class="ingredients-grid" id="ingredientsGrid"></div>
      <div class="action-buttons">
        <button class="action-btn btn-clear" onclick="clearBurger()">🗑️ 清空</button>
        <button class="action-btn btn-serve" onclick="serveBurger()">🍽️ 上菜</button>
      </div>
    </div>
  </div>
  
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script>
    // ===== GAME STATE =====
    const INGREDIENTS = [
      { name: '底层面包', icon: '🟫', class: 'bottom-bun', threeColor: 0xd4a574 },
      { name: '生菜', icon: '🥬', class: 'lettuce', threeColor: 0x4caf50 },
      { name: '番茄', icon: '🍅', class: 'tomato', threeColor: 0xe74c3c },
      { name: '芝士', icon: '🧀', class: 'cheese', threeColor: 0xffd700 },
      { name: '肉饼', icon: '🥩', class: 'patty', threeColor: 0x5d4037 },
      { name: '洋葱', icon: '🧅', class: 'onion', threeColor: 0xffffff },
      { name: '酸黄瓜', icon: '🥒', class: 'pickle', threeColor: 0x689f38 },
      { name: '顶层面包', icon: '🟫', class: 'top-bun', threeColor: 0xd4a574 }
    ];
    
    const RECIPES = [
      ['底层面包', '生菜', '肉饼', '芝士', '番茄', '顶层面包'],
      ['底层面包', '肉饼', '芝士', '生菜', '顶层面包'],
      ['底层面包', '生菜', '番茄', '肉饼', '洋葱', '顶层面包'],
      ['底层面包', '肉饼', '芝士', '酸黄瓜', '生菜', '顶层面包'],
      ['底层面包', '生菜', '肉饼', '番茄', '芝士', '洋葱', '顶层面包']
    ];
    
    const CUSTOMER_FACES = ['😊', '😄', '🙂', '😃', '😁', '🤤', '😋'];
    
    let gameState = {
      money: 0,
      score: 0,
      served: 0,
      totalCustomers: 10,
      currentOrder: null,
      currentBurger: [],
      timer: 0,
      maxTimer: 30,
      isPlaying: false,
      scene: null,
      camera: null,
      renderer: null,
      burgerGroup: null,
      animationId: null
    };
    
    // ===== THREE.JS SETUP =====
    function initThreeJS() {
      const canvas = document.getElementById('gameCanvas');
      
      // Scene
      gameState.scene = new THREE.Scene();
      gameState.scene.background = new THREE.Color(0x1a1a2e);
      gameState.scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);
      
      // Camera
      gameState.camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      gameState.camera.position.set(0, 5, 8);
      gameState.camera.lookAt(0, 0, 0);
      
      // Renderer
      gameState.renderer = new THREE.WebGLRenderer({ 
        canvas: canvas,
        antialias: true 
      });
      gameState.renderer.setSize(window.innerWidth, window.innerHeight);
      gameState.renderer.shadowMap.enabled = true;
      
      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      gameState.scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 5);
      directionalLight.castShadow = true;
      gameState.scene.add(directionalLight);
      
      // Counter/Table
      const counterGeometry = new THREE.BoxGeometry(6, 0.2, 3);
      const counterMaterial = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
      const counter = new THREE.Mesh(counterGeometry, counterMaterial);
      counter.position.y = -1;
      counter.receiveShadow = true;
      gameState.scene.add(counter);
      
      // Burger assembly area
      gameState.burgerGroup = new THREE.Group();
      gameState.burgerGroup.position.set(0, 0, 0);
      gameState.scene.add(gameState.burgerGroup);
      
      // Handle window resize
      window.addEventListener('resize', onWindowResize);
    }
    
    function onWindowResize() {
      gameState.camera.aspect = window.innerWidth / window.innerHeight;
      gameState.camera.updateProjectionMatrix();
      gameState.renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // ===== 3D BURGER RENDERING =====
    function update3DBurger() {
      // Clear existing burger
      while (gameState.burgerGroup.children.length > 0) {
        gameState.burgerGroup.remove(gameState.burgerGroup.children[0]);
      }
      
      // Add 3D layers for each ingredient
      const layerHeight = 0.3;
      let yOffset = -0.5;
      
      gameState.currentBurger.forEach((ingredient, index) => {
        const ing = INGREDIENTS.find(i => i.name === ingredient);
        if (ing) {
          const geometry = new THREE.CylinderGeometry(0.8, 0.8, layerHeight, 32);
          const material = new THREE.MeshLambertMaterial({ color: ing.threeColor });
          const mesh = new THREE.Mesh(geometry, material);
          mesh.position.y = yOffset;
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          gameState.burgerGroup.add(mesh);
        }
        yOffset += layerHeight;
      });
      
      // Rotate burger slowly
      gameState.burgerGroup.rotation.y += 0.01;
    }
    
    // ===== GAME LOGIC =====
    function startGame() {
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('gameUI').style.display = 'block';
      
      initThreeJS();
      setupIngredients();
      generateNewOrder();
      
      gameState.isPlaying = true;
      gameState.timer = gameState.maxTimer;
      
      // Start animation loop
      animate();
      
      // Start timer
      startTimer();
      
      showNotification('🎉 第一位顾客来了！');
    }
    
    function setupIngredients() {
      const grid = document.getElementById('ingredientsGrid');
      grid.innerHTML = '';
      
      INGREDIENTS.forEach(ingredient => {
        const btn = document.createElement('button');
        btn.className = 'ingredient-btn';
        btn.innerHTML = `
          <span class="icon">${ingredient.icon}</span>
          <span class="name">${ingredient.name}</span>
        `;
        btn.onclick = () => addIngredient(ingredient.name);
        grid.appendChild(btn);
      });
    }
    
    function generateNewOrder() {
      const recipeIndex = Math.floor(Math.random() * RECIPES.length);
      const recipe = RECIPES[recipeIndex];
      
      gameState.currentOrder = {
        ingredients: recipe,
        customerFace: CUSTOMER_FACES[Math.floor(Math.random() * CUSTOMER_FACES.length)]
      };
      
      gameState.currentBurger = [];
      gameState.timer = gameState.maxTimer;
      
      updateOrderDisplay();
      updateBurgerDisplay();
      update3DBurger();
    }
    
    function updateOrderDisplay() {
      const orderItems = document.getElementById('orderItems');
      orderItems.innerHTML = '';
      
      if (!gameState.currentOrder) return;
      
      gameState.currentOrder.ingredients.forEach(ingredient => {
        const ing = INGREDIENTS.find(i => i.name === ingredient);
        const item = document.createElement('div');
        item.className = 'order-item';
        
        const isAdded = gameState.currentBurger.includes(ingredient);
        if (isAdded) {
          item.classList.add('ready');
        }
        
        item.innerHTML = `
          <span class="ingredient-icon">${ing ? ing.icon : '❓'}</span>
          <span class="ingredient-name">${ingredient}</span>
          <span class="status-icon">${isAdded ? '✅' : '⬜'}</span>
        `;
        
        orderItems.appendChild(item);
      });
      
      document.getElementById('customerAvatar').textContent = 
        gameState.currentOrder.customerFace;
    }
    
    function updateBurgerDisplay() {
      const display = document.getElementById('burgerDisplay');
      display.innerHTML = '<div style="text-align: center; color: var(--text-secondary); font-size: 14px;">汉堡组装区</div>';
      
      gameState.currentBurger.forEach(ingredient => {
        const ing = INGREDIENTS.find(i => i.name === ingredient);
        if (ing) {
          const layer = document.createElement('div');
          layer.className = `burger-layer ${ing.class}`;
          layer.textContent = ing.icon;
          display.appendChild(layer);
        }
      });
    }
    
    function addIngredient(name) {
      if (!gameState.isPlaying) return;
      
      gameState.currentBurger.push(name);
      updateOrderDisplay();
      updateBurgerDisplay();
      update3DBurger();
      
      // Play sound effect (visual feedback)
      const btn = event.target.closest('.ingredient-btn');
      if (btn) {
        btn.style.transform = 'scale(0.95)';
        setTimeout(() => {
          btn.style.transform = '';
        }, 100);
      }
    }
    
    function clearBurger() {
      if (!gameState.isPlaying) return;
      
      gameState.currentBurger = [];
      updateOrderDisplay();
      updateBurgerDisplay();
      update3DBurger();
    }
    
    function serveBurger() {
      if (!gameState.isPlaying) return;
      
      const orderIngredients = gameState.currentOrder.ingredients;
      const burgerIngredients = gameState.currentBurger;
      
      // Check if burger matches order
      const isCorrect = orderIngredients.length === burgerIngredients.length &&
        orderIngredients.every((ing, idx) => ing === burgerIngredients[idx]);
      
      if (isCorrect) {
        // Success!
        const timeBonus = Math.floor(gameState.timer * 10);
        const earnings = 50 + timeBonus;
        
        gameState.money += earnings;
        gameState.score += 100 + Math.floor(gameState.timer * 10);
        gameState.served++;
        
        showNotification(`✅ 完美！获得 ¥${earnings}`);
        
        if (gameState.served >= gameState.totalCustomers) {
          endGame();
        } else {
          setTimeout(() => {
            generateNewOrder();
          }, 1500);
        }
      } else {
        // Wrong order
        showNotification('❌ 订单不正确！', true);
        gameState.score = Math.max(0, gameState.score - 50);
        
        setTimeout(() => {
          clearBurger();
        }, 1000);
      }
      
      updateStats();
    }
    
    function startTimer() {
      const timerInterval = setInterval(() => {
        if (!gameState.isPlaying) {
          clearInterval(timerInterval);
          return;
        }
        
        gameState.timer -= 0.1;
        
        // Update timer bar
        const percentage = (gameState.timer / gameState.maxTimer) * 100;
        document.getElementById('timerFill').style.width = percentage + '%';
        
        if (gameState.timer <= 0) {
          // Time's up
          showNotification('⏰ 时间到了！顾客离开了', true);
          gameState.score -= 100;
          gameState.served++;
          
          if (gameState.served >= gameState.totalCustomers) {
            endGame();
          } else {
            setTimeout(() => {
              generateNewOrder();
            }, 1500);
          }
          
          updateStats();
        }
      }, 100);
    }
    
    function updateStats() {
      document.getElementById('moneyDisplay').textContent = `¥${gameState.money}`;
      document.getElementById('scoreDisplay').textContent = gameState.score;
      document.getElementById('servedDisplay').textContent = 
        `${gameState.served}/${gameState.totalCustomers}`;
    }
    
    function showNotification(message, isError = false) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.className = 'notification' + (isError ? ' error' : '');
      
      setTimeout(() => {
        notif.classList.add('show');
      }, 10);
      
      setTimeout(() => {
        notif.classList.remove('show');
      }, 2000);
    }
    
    function endGame() {
      gameState.isPlaying = false;
      document.getElementById('gameUI').style.display = 'none';
      document.getElementById('gameOverScreen').classList.add('show');
      document.getElementById('finalScore').textContent = 
        `最终得分: ${gameState.score} | 收入: ¥${gameState.money}`;
    }
    
    function restartGame() {
      // Reset game state
      gameState.money = 0;
      gameState.score = 0;
      gameState.served = 0;
      gameState.currentOrder = null;
      gameState.currentBurger = [];
      
      document.getElementById('gameOverScreen').classList.remove('show');
      startGame();
    }
    
    // ===== ANIMATION LOOP =====
    function animate() {
      if (!gameState.isPlaying) return;
      
      gameState.animationId = requestAnimationFrame(animate);
      
      // Render scene
      gameState.renderer.render(gameState.scene, gameState.camera);
    }
    
    // ===== KEYBOARD CONTROLS =====
    document.addEventListener('keydown', (e) => {
      if (!gameState.isPlaying) return;
      
      const keyMap = {
        '1': 0, '2': 1, '3': 2, '4': 3,
        '5': 4, '6': 5, '7': 6, '8': 7
      };
      
      if (keyMap[e.key] !== undefined) {
        const ingredient = INGREDIENTS[keyMap[e.key]];
        addIngredient(ingredient.name);
      }
      
      if (e.key === 'c' || e.key === 'C') {
        clearBurger();
      }
      
      if (e.key === 's' || e.key === 'S') {
        serveBurger();
      }
    });
    
    // Prevent zoom on mobile
    document.addEventListener('touchmove', (e) => {
      if (e.target.closest('.ui-overlay')) return;
      e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
