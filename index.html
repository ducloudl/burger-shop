<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>🍔 Burger Rush - 汉堡快闪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --clr-bg:        #1c1108;
      --clr-surface:   #2a1a0e;
      --clr-surface-2: #3a2515;
      --clr-border:    #4a3520;
      --clr-text:      #f5e6d3;
      --clr-text-dim:  #a89080;
      --clr-accent:    #ff6b2b;
      --clr-accent-glow: rgba(255, 107, 43, 0.35);
      --clr-success:   #34d399;
      --clr-danger:    #f87171;
      --clr-warning:   #fbbf24;
      --clr-cheese:    #fbbf24;
      --font: 'Nunito', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --sp-xs:  4px;
      --sp-sm:  8px;
      --sp-md:  14px;
      --sp-lg:  20px;
      --sp-xl:  28px;
      --rad-sm: 8px;
      --rad-md: 12px;
      --rad-lg: 16px;
      --rad-full: 999px;
      --shadow-sm: 0 2px 6px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
      --shadow-glow: 0 0 16px var(--clr-accent-glow);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: var(--font);
      background: var(--clr-bg);
      color: var(--clr-text);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---- Canvas ---- */
    #gameCanvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* ---- UI Layer ---- */
    .ui-layer {
      position: fixed; inset: 0;
      z-index: 10;
      pointer-events: none;
    }
    .ui-layer > * { pointer-events: auto; }

    /* ============================================
       SCREENS
       ============================================ */
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 50;
      transition: opacity 0.4s, transform 0.4s;
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.05);
    }

    #startScreen {
      background: radial-gradient(ellipse at 50% 40%, #3a2010 0%, #1c1108 70%);
    }
    #startScreen .logo {
      font-size: clamp(44px, 12vw, 72px);
      margin-bottom: var(--sp-sm);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    #startScreen h1 {
      font-size: clamp(26px, 7vw, 44px);
      font-weight: 900;
      background: linear-gradient(135deg, var(--clr-accent), var(--clr-cheese));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: var(--sp-xs);
    }
    #startScreen .subtitle {
      font-size: clamp(13px, 3.5vw, 17px);
      color: var(--clr-text-dim);
      margin-bottom: var(--sp-lg);
      text-align: center;
      max-width: 360px;
      line-height: 1.5;
      padding: 0 var(--sp-md);
    }
    .btn-primary {
      padding: 14px 44px;
      font-size: 18px;
      font-weight: 800;
      font-family: var(--font);
      color: #fff;
      background: linear-gradient(135deg, var(--clr-accent), #ff8c42);
      border: none;
      border-radius: var(--rad-full);
      cursor: pointer;
      box-shadow: var(--shadow-glow), var(--shadow-md);
      transition: transform 0.15s, box-shadow 0.15s;
      min-width: 180px;
      text-align: center;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 24px var(--clr-accent-glow), var(--shadow-lg); }
    .btn-primary:active { transform: translateY(0) scale(0.97); }

    #gameOverScreen { background: rgba(28, 17, 8, 0.95); backdrop-filter: blur(10px); }
    #gameOverScreen h2 {
      font-size: clamp(24px, 6vw, 38px);
      font-weight: 900;
      color: var(--clr-warning);
      margin-bottom: var(--sp-md);
    }
    .final-stats {
      display: flex; gap: var(--sp-md);
      margin-bottom: var(--sp-lg);
    }
    .final-stat { text-align: center; }
    .final-stat .value { font-size: 32px; font-weight: 900; color: var(--clr-accent); }
    .final-stat .label { font-size: 12px; color: var(--clr-text-dim); margin-top: 2px; }

    /* ============================================
       HUD — Top Bar
       ============================================ */
    .hud-top {
      position: absolute;
      top: var(--safe-top);
      left: 0; right: 0;
      padding: 8px var(--sp-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(28,17,8,0.92) 0%, transparent 100%);
      z-index: 20;
    }
    .hud-brand {
      font-size: 15px;
      font-weight: 800;
      color: var(--clr-accent);
    }
    .hud-stats {
      display: flex; gap: 6px;
    }
    .hud-stat {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--rad-full);
      font-size: 12px;
      font-weight: 700;
    }
    .hud-stat .icon { font-size: 14px; }

    /* ============================================
       CUSTOMER CARD
       ============================================ */
    .customer-card {
      position: absolute;
      top: calc(var(--safe-top) + 44px);
      left: var(--sp-md);
      width: 200px;
      background: var(--clr-surface);
      border: 2px solid var(--clr-border);
      border-radius: var(--rad-lg);
      padding: 10px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.3s, transform 0.5s, opacity 0.5s;
    }
    .customer-card.ok { border-color: var(--clr-border); }
    .customer-card.impatient { border-color: var(--clr-warning); animation: pulse-warn 1s infinite; }
    .customer-card.angry { border-color: var(--clr-danger); animation: shake 0.4s; }

    @keyframes pulse-warn {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
      50% { box-shadow: 0 0 0 5px rgba(251, 191, 36, 0.2); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .customer-face {
      font-size: 36px;
      text-align: center;
      margin-bottom: 2px;
    }
    .customer-name {
      text-align: center;
      font-size: 12px;
      color: var(--clr-text-dim);
      margin-bottom: 6px;
    }
    .timer-track {
      width: 100%;
      height: 5px;
      background: var(--clr-surface-2);
      border-radius: var(--rad-full);
      overflow: hidden;
      margin-bottom: 6px;
    }
    .timer-fill {
      height: 100%;
      border-radius: var(--rad-full);
      transition: width 0.1s linear, background 0.3s;
      background: var(--clr-success);
    }
    .timer-fill.warn { background: var(--clr-warning); }
    .timer-fill.danger { background: var(--clr-danger); }

    .order-list {
      display: flex; flex-direction: column; gap: 3px;
    }
    .order-row {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 6px;
      border-radius: var(--rad-sm);
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .order-row.done {
      background: rgba(52, 211, 153, 0.15);
      color: var(--clr-success);
    }
    .order-row .oi { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
    .order-row .check { margin-left: auto; font-size: 13px; }

    /* ============================================
       BURGER PREVIEW — Center
       ============================================ */
    .burger-preview {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 2px;
      z-index: 15;
    }
    .bp-label {
      font-size: 10px;
      color: var(--clr-text-dim);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .bp-layer {
      width: 130px;
      height: 24px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      animation: layerDrop 0.25s ease-out;
      box-shadow: 0 2px 3px rgba(0,0,0,0.3);
    }
    @keyframes layerDrop {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .bp-layer.l-bottom  { background: linear-gradient(180deg, #d4a056, #b8863a); border-radius: 5px 5px 9px 9px; }
    .bp-layer.l-top     { background: linear-gradient(180deg, #d4a056, #b8863a); border-radius: 12px 12px 5px 5px; height: 28px; }
    .bp-layer.l-lettuce { background: linear-gradient(180deg, #6abf5b, #4a9e3a); }
    .bp-layer.l-tomato  { background: linear-gradient(180deg, #f07060, #d04030); }
    .bp-layer.l-cheese  { background: linear-gradient(180deg, #ffe066, #e6c820); }
    .bp-layer.l-patty   { background: linear-gradient(180deg, #7a5030, #5a3520); }
    .bp-layer.l-onion   { background: rgba(255,255,255,0.25); border: 2px dashed rgba(255,255,255,0.4); }
    .bp-layer.l-pickle  { background: linear-gradient(180deg, #8bc34a, #6a9e30); }
    .bp-empty {
      font-size: 11px;
      color: var(--clr-text-dim);
      text-align: center;
      padding: 24px 0;
    }

    /* ============================================
       INGREDIENT BAR — Bottom
       ============================================ */
    .ingredient-bar {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 10px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 6px 8px;
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--rad-lg);
      box-shadow: var(--shadow-lg);
      z-index: 20;
    }
    .ing-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 8px 10px;
      background: var(--clr-surface-2);
      border: 2px solid transparent;
      border-radius: var(--rad-md);
      cursor: pointer;
      transition: all 0.15s;
      color: var(--clr-text);
      min-width: 48px;
    }
    .ing-btn:hover {
      background: var(--clr-border);
      transform: translateY(-2px);
      border-color: var(--clr-accent);
    }
    .ing-btn:active {
      transform: translateY(0) scale(0.93);
    }
    .ing-btn .emoji { font-size: 22px; line-height: 1; }
    .ing-btn .name { font-size: 9px; font-weight: 700; opacity: 0.8; }

    .bar-actions {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      padding-left: 8px;
      border-left: 1px solid var(--clr-border);
      margin-left: 2px;
    }
    .action-btn {
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 800;
      font-family: var(--font);
      border: none;
      border-radius: var(--rad-sm);
      cursor: pointer;
      transition: all 0.15s;
      color: #fff;
      min-height: 36px;
    }
    .action-btn:active { transform: scale(0.95); }
    .btn-undo {
      background: var(--clr-surface-2);
      color: var(--clr-text-dim);
      border: 1px solid var(--clr-border);
    }
    .btn-undo:hover { border-color: var(--clr-warning); color: var(--clr-warning); }
    .btn-clear {
      background: var(--clr-surface-2);
      color: var(--clr-text-dim);
      border: 1px solid var(--clr-border);
    }
    .btn-clear:hover { border-color: var(--clr-danger); color: var(--clr-danger); }
    .btn-serve {
      background: linear-gradient(135deg, var(--clr-success), #2ecc71);
      box-shadow: 0 2px 6px rgba(52, 211, 153, 0.3);
    }
    .btn-serve:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(52, 211, 153, 0.4); }

    /* ============================================
       NOTIFICATIONS
       ============================================ */
    .notif-container {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 100;
      pointer-events: none;
    }
    .notif {
      padding: 10px 24px;
      border-radius: var(--rad-full);
      font-size: 15px;
      font-weight: 800;
      animation: notifIn 0.3s ease-out, notifOut 0.3s ease-in 1.5s forwards;
      white-space: nowrap;
    }
    .notif.success { background: rgba(52, 211, 153, 0.95); color: #000; }
    .notif.error   { background: rgba(248, 113, 113, 0.95); color: #000; }
    .notif.info    { background: rgba(255, 107, 43, 0.95); color: #fff; }
    .notif.money   { background: rgba(251, 191, 36, 0.95); color: #000; }

    @keyframes notifIn {
      from { opacity: 0; transform: translateY(16px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes notifOut {
      from { opacity: 1; }
      to   { opacity: 0; transform: translateY(-8px); }
    }

    /* ============================================
       TABLET — 601px to 900px
       ============================================ */
    @media (min-width: 601px) and (max-width: 900px) {
      .customer-card {
        width: 220px;
        top: 60px;
      }
      .burger-preview {
        width: 180px;
        top: 42%;
      }
      .bp-layer { width: 140px; height: 28px; font-size: 20px; }
      .ingredient-bar {
        bottom: 20px;
        padding: 8px 12px;
      }
      .ing-btn { min-width: 56px; padding: 10px 12px; }
      .ing-btn .emoji { font-size: 24px; }
      .bar-actions { flex-direction: row; gap: 6px; }
    }

    /* ============================================
       DESKTOP — > 900px
       ============================================ */
    @media (min-width: 901px) {
      .customer-card {
        width: 240px;
        top: 60px;
        left: 30px;
        padding: 14px;
      }
      .customer-face { font-size: 44px; }
      .order-row { font-size: 13px; padding: 6px 10px; }
      .order-row .oi { font-size: 20px; width: 26px; }

      .burger-preview {
        width: 200px;
        top: 40%;
      }
      .bp-layer { width: 160px; height: 30px; font-size: 22px; }
      .bp-label { font-size: 12px; }

      .ingredient-bar {
        bottom: 24px;
        padding: 10px 14px;
        gap: 6px;
      }
      .ing-btn {
        min-width: 64px;
        padding: 12px 14px;
      }
      .ing-btn .emoji { font-size: 28px; }
      .ing-btn .name { font-size: 11px; }

      .bar-actions {
        flex-direction: row;
        padding-left: 12px;
        margin-left: 6px;
        gap: 6px;
      }
      .action-btn {
        padding: 10px 20px;
        font-size: 13px;
        min-height: 40px;
      }

      .hud-top { padding: 10px 24px; }
      .hud-stat { padding: 6px 14px; font-size: 14px; }
      .hud-brand { font-size: 18px; }
      .hud-stats { gap: 10px; }

      .notif { font-size: 18px; padding: 12px 28px; }
      .final-stat .value { font-size: 40px; }
    }

    /* ============================================
       SMALL PHONE — < 380px
       ============================================ */
    @media (max-width: 380px) {
      .customer-card {
        width: 160px;
        padding: 8px;
        top: calc(var(--safe-top) + 40px);
      }
      .customer-face { font-size: 28px; }
      .order-row { font-size: 11px; padding: 3px 5px; gap: 4px; }
      .order-row .oi { font-size: 14px; width: 18px; }
      .hud-stat { padding: 3px 8px; font-size: 11px; }
      .hud-brand { font-size: 13px; }

      .burger-preview {
        width: 120px;
        top: 35%;
      }
      .bp-layer { width: 100px; height: 20px; font-size: 15px; }

      .ingredient-bar {
        padding: 4px 6px;
        gap: 2px;
        bottom: calc(var(--safe-bottom) + 6px);
      }
      .ing-btn {
        min-width: 40px;
        padding: 6px 4px;
      }
      .ing-btn .emoji { font-size: 18px; }
      .ing-btn .name { font-size: 8px; }
      .bar-actions { padding-left: 4px; margin-left: 2px; }
      .action-btn { padding: 5px 10px; font-size: 10px; min-height: 32px; }
    }
  </style>
</head>
<body>

  <!-- 3D Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- ==================== START SCREEN ==================== -->
  <div class="screen" id="startScreen">
    <div class="logo">🍔</div>
    <h1>Burger Rush</h1>
    <p class="subtitle">在繁忙的汉堡店里，根据顾客的订单快速制作汉堡！<br>时间越短，奖励越多。</p>
    <button class="btn-primary" id="btnStart">开始营业 🍳</button>
  </div>

  <!-- ==================== GAME OVER SCREEN ==================== -->
  <div class="screen hidden" id="gameOverScreen">
    <h2>🌙 今日打烊</h2>
    <div class="final-stats">
      <div class="final-stat">
        <div class="value" id="finalScore">0</div>
        <div class="label">总分</div>
      </div>
      <div class="final-stat">
        <div class="value" id="finalMoney">¥0</div>
        <div class="label">收入</div>
      </div>
      <div class="final-stat">
        <div class="value" id="finalServed">0</div>
        <div class="label">服务顾客</div>
      </div>
    </div>
    <button class="btn-primary" id="btnRestart">明天再来 💪</button>
  </div>

  <!-- ==================== GAME HUD ==================== -->
  <div class="ui-layer hidden" id="gameUI">
    <!-- Top Bar -->
    <div class="hud-top">
      <div class="hud-brand">🍔 Burger Rush</div>
      <div class="hud-stats">
        <div class="hud-stat"><span class="icon">💰</span><span id="hudMoney">¥0</span></div>
        <div class="hud-stat"><span class="icon">⭐</span><span id="hudScore">0</span></div>
        <div class="hud-stat"><span class="icon">👥</span><span id="hudServed">0/10</span></div>
      </div>
    </div>

    <!-- Customer Card -->
    <div class="customer-card ok" id="customerCard">
      <div class="customer-face" id="custFace">😊</div>
      <div class="customer-name" id="custName">顾客</div>
      <div class="timer-track">
        <div class="timer-fill" id="timerFill" style="width: 100%"></div>
      </div>
      <div class="order-list" id="orderList"></div>
    </div>

    <!-- Burger Preview -->
    <div class="burger-preview" id="burgerPreview">
      <div class="bp-label">你的汉堡</div>
      <div class="bp-empty">点击下方食材开始制作</div>
    </div>

    <!-- Ingredient Bar -->
    <div class="ingredient-bar" id="ingredientBar">
      <!-- Buttons injected by JS -->
      <div class="bar-actions">
        <button class="action-btn btn-undo" id="btnUndo">↩ 撤销</button>
        <button class="action-btn btn-clear" id="btnClear">🗑 清空</button>
        <button class="action-btn btn-serve" id="btnServe">🍽 上菜</button>
      </div>
    </div>

    <!-- Notifications -->
    <div class="notif-container" id="notifContainer"></div>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // =============================================
    // DATA
    // =============================================
    const INGREDIENTS = [
      { name: '底层面包', emoji: '🟫', cls: 'l-bottom',  color: 0xb8863a },
      { name: '生菜',     emoji: '🥬', cls: 'l-lettuce', color: 0x4a9e3a },
      { name: '番茄',     emoji: '🍅', cls: 'l-tomato',  color: 0xd04030 },
      { name: '芝士',     emoji: '🧀', cls: 'l-cheese',  color: 0xe6c820 },
      { name: '肉饼',     emoji: '🥩', cls: 'l-patty',   color: 0x5a3520 },
      { name: '洋葱',     emoji: '🧅', cls: 'l-onion',   color: 0xffffff },
      { name: '酸黄瓜',   emoji: '🥒', cls: 'l-pickle',  color: 0x6a9e30 },
      { name: '顶层面包', emoji: '🟫', cls: 'l-top',     color: 0xb8863a },
    ];

    const RECIPES = [
      ['底层面包','生菜','肉饼','芝士','番茄','顶层面包'],
      ['底层面包','肉饼','芝士','生菜','顶层面包'],
      ['底层面包','生菜','番茄','肉饼','洋葱','顶层面包'],
      ['底层面包','肉饼','芝士','酸黄瓜','生菜','顶层面包'],
      ['底层面包','生菜','肉饼','番茄','芝士','洋葱','顶层面包'],
      ['底层面包','肉饼','芝士','生菜','番茄','顶层面包'],
      ['底层面包','生菜','洋葱','肉饼','芝士','顶层面包'],
    ];

    const CUSTOMERS = [
      { name: '小明',   face: '😊' },
      { name: '小红',   face: '😄' },
      { name: '老王',   face: '🙂' },
      { name: '小李',   face: '😃' },
      { name: '阿花',   face: '😁' },
      { name: '张叔',   face: '🤤' },
      { name: '陈姐',   face: '😋' },
      { name: '刘哥',   face: '😎' },
    ];

    // =============================================
    // STATE
    // =============================================
    const S = {
      money: 0, score: 0, served: 0, total: 10,
      order: null, burger: [], timer: 0, maxTimer: 30,
      playing: false, scene: null, camera: null, renderer: null,
      burgerGroup: null, animId: null, timerInterval: null,
    };

    // =============================================
    // THREE.JS
    // =============================================
    function init3D() {
      const canvas = document.getElementById('gameCanvas');
      S.scene = new THREE.Scene();
      S.scene.background = new THREE.Color(0x1c1108);
      S.scene.fog = new THREE.FogExp2(0x1c1108, 0.04);

      S.camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
      S.camera.position.set(0, 4, 7);
      S.camera.lookAt(0, 0, 0);

      S.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      S.renderer.setSize(innerWidth, innerHeight);
      S.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      S.renderer.shadowMap.enabled = true;
      S.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const amb = new THREE.AmbientLight(0xffeedd, 0.5);
      S.scene.add(amb);
      const dir = new THREE.DirectionalLight(0xfff0dd, 0.9);
      dir.position.set(3, 8, 5);
      dir.castShadow = true;
      dir.shadow.mapSize.set(1024, 1024);
      S.scene.add(dir);
      const pt = new THREE.PointLight(0xff6b2b, 0.4, 15);
      pt.position.set(-2, 3, 2);
      S.scene.add(pt);

      const floorGeo = new THREE.PlaneGeometry(20, 20);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0e, roughness: 0.9 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -1.5;
      floor.receiveShadow = true;
      S.scene.add(floor);

      const counterGeo = new THREE.BoxGeometry(5, 0.3, 2.5);
      const counterMat = new THREE.MeshStandardMaterial({ color: 0x5a3520, roughness: 0.7 });
      const counter = new THREE.Mesh(counterGeo, counterMat);
      counter.position.set(0, -1.2, 0);
      counter.castShadow = true;
      counter.receiveShadow = true;
      S.scene.add(counter);

      S.burgerGroup = new THREE.Group();
      S.burgerGroup.position.set(0, -0.8, 0);
      S.scene.add(S.burgerGroup);

      window.addEventListener('resize', () => {
        S.camera.aspect = innerWidth / innerHeight;
        S.camera.updateProjectionMatrix();
        S.renderer.setSize(innerWidth, innerHeight);
      });
    }

    function render3DBurger() {
      while (S.burgerGroup.children.length) S.burgerGroup.remove(S.burgerGroup.children[0]);
      const layerH = 0.18;
      let y = -0.3;
      S.burger.forEach((name) => {
        const ing = INGREDIENTS.find(x => x.name === name);
        if (!ing) return;
        const geo = new THREE.CylinderGeometry(0.55, 0.55, layerH, 24);
        const mat = new THREE.MeshStandardMaterial({
          color: ing.color, roughness: 0.6, metalness: 0.05,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = y;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        S.burgerGroup.add(mesh);
        y += layerH;
      });
    }

    // =============================================
    // UI HELPERS
    // =============================================
    function $(id) { return document.getElementById(id); }

    function showScreen(id) {
      ['startScreen', 'gameOverScreen', 'gameUI'].forEach(s => {
        const el = $(s);
        if (s === id) {
          el.classList.remove('hidden');
          el.style.pointerEvents = 'auto';
        } else {
          el.classList.add('hidden');
          el.style.pointerEvents = 'none';
        }
      });
    }

    function notify(msg, type = 'info') {
      const c = $('notifContainer');
      const n = document.createElement('div');
      n.className = `notif ${type}`;
      n.textContent = msg;
      c.appendChild(n);
      setTimeout(() => n.remove(), 2000);
    }

    function buildIngredientBar() {
      const bar = $('ingredientBar');
      const actions = bar.querySelector('.bar-actions');
      bar.querySelectorAll('.ing-btn').forEach(b => b.remove());
      INGREDIENTS.forEach((ing) => {
        const btn = document.createElement('button');
        btn.className = 'ing-btn';
        btn.innerHTML = `<span class="emoji">${ing.emoji}</span><span class="name">${ing.name}</span>`;
        btn.onclick = () => addIngredient(ing.name);
        bar.insertBefore(btn, actions);
      });
    }

    function updateOrderUI() {
      if (!S.order) return;
      const list = $('orderList');
      list.innerHTML = '';
      S.order.ingredients.forEach((ingName, idx) => {
        const ing = INGREDIENTS.find(x => x.name === ingName);
        const done = idx < S.burger.length && S.burger[idx] === ingName;
        const row = document.createElement('div');
        row.className = `order-row${done ? ' done' : ''}`;
        const placed = idx < S.burger.length ? S.burger[idx] : '';
        const placedMatch = done ? '✅' : (placed ? `🔸${placed}` : '⬜');
        row.innerHTML = `
          <span class="oi">${ing ? ing.emoji : '?'}</span>
          <span>${ingName}</span>
          <span class="check">${placedMatch}</span>
        `;
        list.appendChild(row);
      });
    }

    function updateBurgerPreview() {
      const bp = $('burgerPreview');
      bp.querySelectorAll('.bp-layer').forEach(l => l.remove());
      const empty = bp.querySelector('.bp-empty');
      if (empty) empty.remove();

      if (S.burger.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'bp-empty';
        emptyDiv.textContent = '点击下方食材开始制作';
        bp.appendChild(emptyDiv);
        return;
      }

      S.burger.forEach(name => {
        const ing = INGREDIENTS.find(x => x.name === name);
        if (!ing) return;
        const layer = document.createElement('div');
        layer.className = `bp-layer ${ing.cls}`;
        layer.textContent = ing.emoji;
        bp.appendChild(layer);
      });
    }

    function updateHUD() {
      $('hudMoney').textContent = `¥${S.money}`;
      $('hudScore').textContent = S.score;
      $('hudServed').textContent = `${S.served}/${S.total}`;
    }

    function updateCustomerCard() {
      const card = $('customerCard');
      const pct = (S.timer / S.maxTimer) * 100;
      const fill = $('timerFill');
      fill.style.width = pct + '%';
      card.classList.remove('ok', 'impatient', 'angry');
      fill.classList.remove('warn', 'danger');
      if (pct > 60) {
        card.classList.add('ok');
      } else if (pct > 30) {
        card.classList.add('impatient');
        fill.classList.add('warn');
      } else {
        card.classList.add('angry');
        fill.classList.add('danger');
      }
    }

    // =============================================
    // GAME LOGIC
    // =============================================
    function startGame() {
      S.money = 0; S.score = 0; S.served = 0;
      showScreen('gameUI');
      init3D();
      buildIngredientBar();
      nextOrder();
      S.playing = true;
      animate();
    }

    function nextOrder() {
      const recipe = RECIPES[Math.floor(Math.random() * RECIPES.length)];
      const cust = CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)];
      S.order = { ingredients: recipe, customer: cust };
      S.burger = [];
      S.timer = S.maxTimer;

      $('custFace').textContent = cust.face;
      $('custName').textContent = cust.name;

      updateOrderUI();
      updateBurgerPreview();
      updateHUD();
      updateCustomerCard();
      render3DBurger();

      if (S.timerInterval) clearInterval(S.timerInterval);
      S.timerInterval = setInterval(tick, 100);
    }

    function tick() {
      if (!S.playing) return;
      S.timer -= 0.1;
      updateCustomerCard();
      if (S.timer <= 0) {
        clearInterval(S.timerInterval);
        notify('⏰ 顾客等不及走了！', 'error');
        S.score = Math.max(0, S.score - 50);
        S.served++;
        updateHUD();
        if (S.served >= S.total) { endGame(); return; }
        setTimeout(nextOrder, 1200);
      }
    }

    function addIngredient(name) {
      if (!S.playing) return;
      S.burger.push(name);
      updateOrderUI();
      updateBurgerPreview();
      render3DBurger();
    }

    function clearBurger() {
      if (!S.playing) return;
      S.burger = [];
      updateOrderUI();
      updateBurgerPreview();
      render3DBurger();
    }

    function undoLast() {
      if (!S.playing || S.burger.length === 0) return;
      S.burger.pop();
      updateOrderUI();
      updateBurgerPreview();
      render3DBurger();
      notify('↩️ 撤销了最后一个', 'info');
    }

    function serveBurger() {
      if (!S.playing || !S.order) return;
      if (S.burger.length === 0) {
        notify('🤔 汉堡是空的！先加点食材', 'info');
        return;
      }
      const need = S.order.ingredients;
      const have = S.burger;
      const correct = need.length === have.length && need.every((v, i) => v === have[i]);

      if (correct) {
        const bonus = Math.floor(S.timer * 5);
        const earn = 30 + bonus;
        S.money += earn;
        S.score += 80 + bonus;
        S.served++;
        notify(`✅ ${S.order.customer.name} 很满意！+¥${earn}`, 'success');
        updateHUD();
        if (S.served >= S.total) { endGame(); return; }
        const card = $('customerCard');
        card.style.transition = 'transform 0.5s, opacity 0.5s';
        card.style.transform = 'translateX(-120%)';
        card.style.opacity = '0';
        setTimeout(() => {
          nextOrder();
          card.style.transform = '';
          card.style.opacity = '';
        }, 600);
      } else {
        if (have.length < need.length) {
          notify(`❌ 还差 ${need.length - have.length} 个食材！`, 'error');
        } else if (have.length > need.length) {
          notify(`❌ 放多了！只要 ${need.length} 个`, 'error');
        } else {
          const wrongIdx = need.findIndex((v, i) => v !== have[i]);
          notify(`❌ 第${wrongIdx + 1}层不对，应该是 ${need[wrongIdx]}`, 'error');
        }
        S.score = Math.max(0, S.score - 30);
        updateHUD();
        setTimeout(clearBurger, 1000);
      }
    }

    function endGame() {
      S.playing = false;
      clearInterval(S.timerInterval);
      $('finalScore').textContent = S.score;
      $('finalMoney').textContent = `¥${S.money}`;
      $('finalServed').textContent = S.served;
      showScreen('gameOverScreen');
    }

    function restartGame() {
      if (S.animId) cancelAnimationFrame(S.animId);
      if (S.renderer) S.renderer.dispose();
      startGame();
    }

    // =============================================
    // ANIMATION LOOP
    // =============================================
    function animate() {
      if (!S.playing) return;
      S.animId = requestAnimationFrame(animate);
      if (S.burgerGroup) S.burgerGroup.rotation.y += 0.008;
      S.renderer.render(S.scene, S.camera);
    }

    // =============================================
    // EVENTS
    // =============================================
    $('btnStart').onclick = startGame;
    $('btnRestart').onclick = restartGame;
    $('btnUndo').onclick = undoLast;
    $('btnClear').onclick = clearBurger;
    $('btnServe').onclick = serveBurger;

    document.addEventListener('keydown', e => {
      if (!S.playing) return;
      if (e.key === 'z' || e.key === 'Z') { undoLast(); return; }
      if (e.key === 'Backspace' || e.key === 'Delete') { clearBurger(); return; }
      const map = { '1':'add0','2':'add1','3':'add2','4':'add3','5':'add4','6':'add5','7':'add6','8':'add7' };
      if (map[e.key]) {
        const idx = parseInt(e.key) - 1;
        if (INGREDIENTS[idx]) addIngredient(INGREDIENTS[idx].name);
      }
      if (e.key === 'c' || e.key === 'C') clearBurger();
      if (e.key === 's' || e.key === 'S') serveBurger();
    });

    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - (document.lastTouchEnd || 0) <= 300) e.preventDefault();
      document.lastTouchEnd = now;
    }, false);
  </script>
</body>
</html>
